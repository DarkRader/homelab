apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-backup-daily
spec:
  immediate: true
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: zitadel-db-cnpg-v0
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
