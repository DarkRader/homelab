apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: linkding-db-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "linkding"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: LINKDING_DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-backup-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: gcs-backup-creds
    creationPolicy: Owner
  data:
    - secretKey: service-account-key.json
      remoteRef:
        key: CNPG_BACKUP_SA_KEY
