apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Herta Station Dashboard
    theme: dark
    color: slate
    background: https://wallpaperaccess.com/full/4592820.jpg
    cardBlur: xl
    headerStyle: clean
    layout:
      style: columns
      columns: 4

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Herta Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        format:
          timeStyle: short
          hourCycle: h23

  services.yaml: |
    - Infrastructure:
        - Router:
            icon: si-openrouter-#38bdf8
            href: https://192.168.18.1:80/
            description: Home Router
        - Flux CD:
            icon: si-flux-#38bdf8
            href: https://fluxcd.io/
            description: GitOps Delivery Engine

    - Application:
        - Linkding:
            icon: mdi-bookmark-box-multiple-#38bdf8
            href: http://192.168.18.41:4001
            description: Bookmark Manager

        - Home Assistant - Not Exist Yet:
            icon: si-homeassistant-#38bdf8
            href: http://homeassistant.192.168.18.41.sslip.io
            description: Home Automation Hub

    - Monitoring:
        - Uptime Kuma - Not Exist Yet:
            icon: si-uptimekuma-#38bdf8
            href: http://192.168.18.41:3030
            description: Service Monitor & Status
        - Prometheus - Not Exist Yet:
            icon: si-prometheus-#38bdf8
            href: http://192.168.18.41:3030
            description: Metrics & Alerts
        - Grafana - Not Exist Yet:
            icon: si-grafana-#38bdf8
            href: http://192.168.18.41:3030
            description: Visualization Dashboards

    - Security and Identity:
        - Zitadel - Not Exist Yet:
            icon: mdi-shield-key-#38bdf8
            href: http://192.168.18.41:3030
            description: Identity & Access Management
        - Vaulwarden - Not Exist Yet:
            icon: si-vaultwarden-#38bdf8
            href: http://192.168.18.41:3030
            description: Password Management

  bookmarks.yaml: |
    - Repositories:
        - Homelab:
            - icon: si-github-#38bdf8
              href: https://github.com/DarkRader/homelab
    - Cloud Services:
        - Cloudflare:
            - icon: si-cloudflare-#38bdf8
              href: https://dash.cloudflare.com/
        - Tailscale:
            - icon: si-tailscale-#38bdf8
              href: https://console.tailscale.com/
    - Cloud Platforms:
        - Google Cloud:
            - icon: si-googlecloud-#38bdf8
              href: https://console.cloud.google.com/
    - Services:
        - GitHub:
            - icon: si-github-#38bdf8
              href: https://github.com/
        - YouTube:
            - icon: si-youtube-#38bdf8
              href: https://youtube.com/
        - Shikimori:
            - icon: si-shikimori-#38bdf8
              href: https://shikimori.io/

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""

  custom.css: |
    /* Apple Liquid Glass + Midnight Cyan/Purple Aesthetic */
    :root {
      --glass-bg: rgba(18, 14, 38, 0.65);
      --glass-border: rgba(139, 92, 246, 0.28);
      --glass-border-hover: rgba(56, 189, 248, 0.7);
      --glass-highlight: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 14px 38px 0 rgba(0, 0, 0, 0.58), inset 0 1px 1px var(--glass-highlight);
      --cyan-accent: #38bdf8;
    }

    body {
      background-color: #0b0718 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Apple squircle liquid glass cards */
    .card,
    [class*="bg-surface-"],
    [class*="bg-slate-"],
    [class*="bg-stone-"],
    [class*="bg-neutral-"],
    [class*="bg-zinc-"] {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(28px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 1.25rem !important;
      box-shadow: var(--glass-shadow) !important;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* Glass interactive hover */
    .card:hover {
      background: rgba(28, 22, 58, 0.78) !important;
      border-color: var(--glass-border-hover) !important;
      transform: translateY(-2px) scale(1.008);
      box-shadow: 0 20px 48px 0 rgba(0, 0, 0, 0.65), 0 0 20px 2px rgba(56, 189, 248, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.3) !important;
    }

    /* Top bar: widgets and search bar */
    header [class*="bg-"],
    header input {
      background: rgba(16, 12, 34, 0.65) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid rgba(139, 92, 246, 0.3) !important;
      border-radius: 1rem !important;
      color: #f8fafc !important;
    }

    header input:focus {
      border-color: var(--cyan-accent) !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45) !important;
      outline: none !important;
    }

    /* High contrast text */
    .card h3,
    .card [class*="font-bold"],
    [class*="service-name"] {
      color: #ffffff !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em;
    }

    .card p,
    .card [class*="text-muted"],
    .card [class*="text-stone-"],
    .card [class*="text-slate-"] {
      color: #cbd5e1 !important;
    }

    /* Section titles */
    h2, [class*="category-title"] {
      color: #f1f5f9 !important;
      font-weight: 600 !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    /* Unified glowing cyan icons */
    .card img,
    .card svg,
    [class*="service-icon"] img,
    [class*="service-icon"] svg,
    [class*="bookmark"] img,
    [class*="bookmark"] svg {
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.55)) !important;
    }

  custom.js: ""
