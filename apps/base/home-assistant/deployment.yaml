apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
        try: "0"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: mirader

      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.0
          env:
            - name: TZ
              value: "Europe/Prague"

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            appArmorProfile:
              type: Unconfined

          # envFrom:
          #   - configMapRef:
          #       name: home-assistant-configmap

          ports:
            - containerPort: 8123
              protocol: TCP

          volumeMounts:
            - name: home-assistant-config
              mountPath: /config
            - name: dbus
              mountPath: /run/dbus
              readOnly: true

      restartPolicy: Always

      volumes:
        - name: home-assistant-config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: dbus
          hostPath:
            path: /run/dbus
