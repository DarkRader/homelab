postgresql:
  enabled: false

initJob:
  enabled: true
  command: "zitadel"

setupJob:
  enabled: true

zitadel:
  masterkeySecretName: zitadel-secrets

  configmapConfig:
    ExternalDomain: auth.homenir.com
    ExternalPort: 80
    ExternalSecure: false
    TLS:
      Enabled: false
    Database:
      postgres:
        Host: zitadel-db-cnpg-v0-rw
        Port: 5432
        Database: zitadel
        User:
          Username: zitadel
          SSL:
            Mode: disable
        Admin:
          Username: zitadel
          SSL:
            Mode: disable
    FirstInstance:
      Org:
        Human:
          UserName: "admin"
          FirstName: "Admin"
          LastName: "Homenir"
          Email: "admin@homenir.com"
          PasswordChangeRequired: false

env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: db-password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: db-password
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: admin-password
