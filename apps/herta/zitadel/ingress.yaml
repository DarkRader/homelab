apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel
  labels:
    app.kubernetes.io/name: zitadel
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.homenir.com
spec:
  ingressClassName: cilium
  rules:
    - host: auth.homenir.com
      http:
        paths:
          - path: "/ui/v2/login"
            pathType: Prefix
            backend:
              service:
                name: zitadel-zitadel-login
                port:
                  number: 3000
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: zitadel-zitadel
                port:
                  number: 8080
