apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n.homenir.com
spec:
  ingressClassName: cilium
  rules:
    - host: n8n.homenir.com
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 3008
