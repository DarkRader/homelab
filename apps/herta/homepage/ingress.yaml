apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    external-dns.alpha.kubernetes.io/hostname: homepage.homenir.com
spec:
  ingressClassName: cilium
  rules:
    - host: homepage.homenir.com
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
