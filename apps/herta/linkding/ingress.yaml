apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  labels:
    app.kubernetes.io/name: linkding
  annotations:
    external-dns.alpha.kubernetes.io/hostname: linkding.192.168.18.195.sslip.io
spec:
  ingressClassName: cilium
  rules:
    - host: linkding.192.168.18.195.sslip.io
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 4001
