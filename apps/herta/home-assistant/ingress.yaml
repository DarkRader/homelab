apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ha.homenir.com
spec:
  ingressClassName: cilium
  rules:
    - host: ha.homenir.com
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
