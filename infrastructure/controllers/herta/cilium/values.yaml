ipam:
  mode: kubernetes

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: 192.168.18.41
k8sServicePort: 6443

hubble:
  relay:
    enabled: true
  ui:
    enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 15
  burst: 20

ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true
